version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: apex-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=apex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    container_name: apex-redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: apex-api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/apex}
      - REDIS_URL=redis://redis:6379
      - DEFAULT_API_KEY=f1_apex_super_secret_dev_key
      - INGEST_SEASONS_LIMIT=5
      - PORT=3000
      - ENV=development
      - ML_SERVICE_URL=http://ml:8000
    depends_on:
      - postgres
      - redis
    restart: always

  ml:
    build:
      context: ./apps/ml
      dockerfile: Dockerfile
    container_name: apex-ml
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENV=development
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/apex}
      - APEX_API_URL=http://api:3000
    depends_on:
      - postgres
      - redis
    restart: always

volumes:
  pgdata:
