version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: apex-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=apex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    container_name: apex-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  pgdata:
